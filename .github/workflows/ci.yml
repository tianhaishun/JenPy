# JenPy 自举 CI —— 用 GitHub Actions 跑自己的测试
# 一个 CI/CD 工具自己有 CI，是对质量最好的背书。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: 运行测试
        run: pytest tests/ -v

  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # 语法/导入错误检查（暂不强制全部风格规则，渐进式推进）
      - run: ruff check jenpy/ tests/ --select=E9,F63,F7,F82

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: 安装并构建前端
        working-directory: web/frontend
        run: |
          npm ci
          npm run build
      - name: 验证构建产物
        run: test -f jenpy/web/static/index.html
