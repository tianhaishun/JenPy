[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jenpy"
version = "0.1.0"
description = "用 Python 写的极简 CI/CD 工具"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
jenpy = "jenpy.cli:main"

[tool.setuptools.packages.find]
include = ["jenpy*"]
