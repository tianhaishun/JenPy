# JenPy 流水线配置示例
# 这是一个能直接跑通的真实示例，展示常用功能。
# 用法：jenpy run -f examples/jenpy.yaml

name: example-pipeline
workspace: .

env:
  PYTHONUNBUFFERED: "1"

stages:
  # 1. 环境检查 —— 最朴素的起步：确认工具链可用
  - name: 检查环境
    steps:
      - name: Python 版本
        run: python --version
      - name: 当前目录
        run: python -c "import os; print(os.getcwd())"

  # 2. 构建阶段 —— 用 python -c 保证跨平台（Windows 无 mkdir/pwd/date）
  - name: 构建
    steps:
      - name: 清理产物
        run: python -c "print('cleaning...')"
        continue_on_error: true
      - name: 创建构建产物
        run: python -c "import os,datetime; os.makedirs('dist',exist_ok=True); open('dist/build.txt','w').write(f'built at {datetime.datetime.now()}')"

  # 3. 测试阶段
  - name: 测试
    steps:
      - name: 运行测试
        run: pytest -v
        continue_on_error: true   # 没装 pytest 时也不阻断演示

  # 4. 部署阶段 —— 仅 main 分支执行
  - name: 部署
    when: branch == 'main'
    steps:
      - name: 部署到服务器
        deploy:
          method: copy              # 用 copy 跨平台，rsync 在 Windows 默认不存在
          source: ./dist/
          target: ./deployed/
          delete: true
