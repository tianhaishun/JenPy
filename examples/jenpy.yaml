# JenPy 流水线配置示例
# 这是一个能直接跑通的真实示例，展示常用功能。
# 用法：jenpy run -f examples/jenpy.yaml

name: example-pipeline
workspace: .

env:
  PYTHONUNBUFFERED: "1"

stages:
  # 1. 环境检查 —— 最朴素的起步：确认工具链可用
  - name: 检查环境
    steps:
      - name: Python 版本
        run: python --version
      - name: 当前目录
        run: pwd

  # 2. 构建阶段
  - name: 构建
    steps:
      - name: 清理产物
        run: echo "cleaning..."
        continue_on_error: true
      - name: 创建构建产物
        run: |
          mkdir -p dist
          echo "built at $(date)" > dist/build.txt

  # 3. 测试阶段
  - name: 测试
    steps:
      - name: 运行测试
        run: pytest -v
        continue_on_error: true   # 没装 pytest 时也不阻断演示

  # 4. 部署阶段 —— 仅 main 分支执行
  - name: 部署
    when: branch == 'main'
    steps:
      - name: 部署到服务器
        deploy:
          method: rsync
          source: ./dist/
          target: user@your-server:/var/www/example/
